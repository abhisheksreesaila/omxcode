[workspace]
authors = ["abhisheksreesaila <abhishek.sreesaila@gmail.com>"]
channels = ["conda-forge"]
name = "mojo-ui"
platforms = [
  { name = "linux-glibc-234", platform = "linux-64", glibc = "2.34" },
  { name = "macos-13", platform = "osx-arm64", macos = "13.0" },
]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.13.*"
lld = ">=23.1.3,<24"
python-fasthtml = ">=0.14.13,<0.15"
pillow = ">=12.3.0,<13"
pyarrow = ">=25.0.0,<26"
python-xlib = ">=0.33,<0.34"
nodejs = ">=26.12.1,<26.13"
esbuild = ">=0.28.1,<0.29"
rust = "==1.99.1"
rust-std-wasm32-unknown-unknown = "==1.99.1"
rust-src = "==1.99.1"
wasm-bindgen-cli = "==0.2.129"
binaryen = ">=121"
python-duckdb = ">=2.0.0,<3"
polars = ">=2.1.0,<3"
fastapi = ">=0.162.0,<0.163"
uvicorn = ">=0.54.0,<0.55"
orjson = ">=3.13.0,<4"

[pypi-dependencies]
mojo = ">=1.1, <1.2"
playwright = ">=1.64.0, <2"
max = ">=26.6.0, <27"
mxframe = "==0.6.0"
ag-ui-protocol = ">=1.0.0, <2"
anthropic = ">=2.3.0, <3"
jsonpatch = ">=1.38, <2"
jsonschema = ">=4.26.0, <5"

[target.linux-glibc-234.dependencies]
xorg-xvfb-server = ">=21.1.25,<22"
xkeyboard-config = ">=2.48,<3"
