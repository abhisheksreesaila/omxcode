<html lang="en" data-theme="dark">
<head>

<title>How a tap stays smooth</title>
<style>
:root{
  --bg:#f5f3ee; --ink:#1d1f25; --muted:#6a6e78; --panel:#fffffff0; --line:#dcd8ce;
  --chip:#ffffff; --accent:#3d5bd9; --bug:#e5484d; --shadow:0 8px 30px #00000014; --r:999px;
  --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161b; --ink:#e8e9ee; --muted:#9aa0ac; --panel:#1d2027f2; --line:#30343f;
    --chip:#1d2027; --accent:#8fa3ff; --shadow:0 8px 30px #00000066;
  }
}
:root[data-theme="dark"]{
  --bg:#14161b; --ink:#e8e9ee; --muted:#9aa0ac; --panel:#1d2027f2; --line:#30343f;
  --chip:#1d2027; --accent:#8fa3ff; --shadow:0 8px 30px #00000066;
}
/* Field Notes: pen, coloured pencil and paper */
:root[data-style="fieldnotes"]{
  --bg:#ece3d0; --ink:#201d19; --muted:#6b6152; --panel:#fbf8edf5; --line:#cdbf9f; --chip:#fbf8ed;
  --accent:#b35f5a; --bug:#c8323a; --shadow:0 6px 22px #3b2e1a1f; --r:3px;
  --font: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root[data-style="fieldnotes"]:not([data-theme="light"]){
    --bg:#221f1a; --ink:#eee5d2; --muted:#a99d88; --panel:#2b2822f5; --line:#4a4337; --chip:#2b2822; --accent:#e0847a; --bug:#ff6b6b;
  }
}
:root[data-style="fieldnotes"][data-theme="dark"]{
  --bg:#221f1a; --ink:#eee5d2; --muted:#a99d88; --panel:#2b2822f5; --line:#4a4337; --chip:#2b2822; --accent:#e0847a; --bug:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);display:grid;grid-template-rows:auto 1fr auto;height:100dvh;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 16px 6px}
header .t{flex:1 1 260px;min-width:0}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
:root[data-style="fieldnotes"] h1{font-size:24px;font-weight:400;letter-spacing:0}
:root[data-style="fieldnotes"] .sub{font-style:italic}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button,select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:var(--r);padding:6px 11px;cursor:pointer}
button:hover,select:hover{border-color:var(--muted)}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button[hidden]{display:none}
:root[data-style="fieldnotes"] button,:root[data-style="fieldnotes"] select{border-color:color-mix(in srgb,var(--ink) 45%,transparent)}
#stage{position:relative;min-height:0}
svg#svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
svg#svg.panning{cursor:grabbing}
.node{cursor:pointer;transition:transform .25s ease, opacity .25s ease}
.node.hot{transform:translateY(-6px)}
.nlabel{transition:transform .25s ease, opacity .25s ease;pointer-events:none}
.nlabel.hot{transform:translateY(-6px)}
.edge,.elabel,.ftag,.shadow{transition:opacity .25s ease}
.ftag{cursor:pointer}
.dim{opacity:.22}
.edge.on .line{stroke:var(--accent);stroke-width:3.2}
.edge.on .head{fill:var(--accent)}
.edge.on .chev{stroke:var(--accent)}
#info{position:absolute;right:16px;top:12px;width:300px;max-height:calc(100% - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
#info.wide{width:380px}
:root[data-style="fieldnotes"] #info{border-radius:4px}
#info[hidden]{display:none}
#info .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:6px}
#info .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
#info h2{font-size:17px;margin:4px 0 2px}
#info .tech{font-size:12.5px;color:var(--muted);margin:0 0 8px}
#info p{font-size:13.5px;line-height:1.5;margin:6px 0}
#info h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 4px}
#info ul{margin:0;padding:0;list-style:none;font-size:13px;line-height:1.6}
#info li span{color:var(--muted)}
#info .x{position:absolute;right:10px;top:10px;padding:2px 8px}
#info .sc{margin:4px -4px 0}
#info .sc svg{width:100%;height:auto;display:block}
#info .sct{font-size:12px;font-style:italic;color:var(--muted);margin:0 0 2px}
#info .rules li{line-height:1.45;margin:3px 0}
#info .rules .ok b{color:#2f8a57}
#info .rules .bad b{color:var(--bug)}
#info .rules ol{margin:4px 0 6px;padding-left:22px;font-size:12px;color:var(--muted)}
#legend{position:absolute;left:16px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(900px,75%);pointer-events:none}
#legend .c{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px 9px}
#legend .sw{width:9px;height:9px;border-radius:2px}
#legend svg{width:22px;height:8px}
footer{display:flex;align-items:center;gap:8px;padding:8px 16px 14px;flex-wrap:wrap;border-top:1px solid var(--line)}
footer[hidden]{display:none}
#caption{flex:1 1 280px;font-size:14px;line-height:1.4;min-height:20px}
:root[data-style="fieldnotes"] #caption{font-style:italic}
#caption b{color:var(--accent);font-variant-numeric:tabular-nums;margin-right:6px;font-style:normal}
#caption .st{font-style:normal;font-size:11.5px;border:1px solid var(--line);border-radius:3px;padding:1px 6px;margin-left:8px;color:var(--muted);white-space:nowrap}
#caption .brk{color:var(--bug);font-style:normal;font-weight:700}
#dots{display:flex;gap:4px}
#dots i{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer}
#dots i.on{background:var(--accent)}
#dots.bug i.on{background:var(--bug)}
@media (max-width:640px){
  #info,#info.wide{left:12px;right:12px;width:auto;top:auto;bottom:12px;max-height:55%}
  #legend{display:none}
}
</style>
</head>
<body>
<header>
  <div class="t"><h1 id="title"></h1><p class="sub" id="subtitle"></p></div>
  <div class="tools">

<main id="stage">

  <div id="dots"></div>
</footer>
<script type="application/json" id="spec">{"title": "How a tap stays smooth", "subtitle": "update() and view() decide on the UI thread; slow work runs on job threads and comes back as an event", "style": "ink", "live": true, "nodes": [{"id": "screen", "label": "Screen", "kind": "client", "at": [0, 0], "hue": 205, "tech": "60 frames a second", "desc": "Every platform draws on one thread. At 60 Hz it has about 16 ms per frame."}, {"id": "ui", "label": "UI thread", "kind": "service", "at": [7, 0], "size": [2.6, 2.6], "hue": 145, "tech": "update() · view()", "desc": "Only decides: changes state and describes the screen. The app's state is only touched here, so no locks and no races in app code."}, {"id": "watch", "label": "Watchdog", "kind": "edge", "at": [7, -6], "hue": 0, "tech": "MOJOUI_BUDGET_MS", "desc": "Names any update(), view() or draw over the budget (SLOW: update msg=7 80 ms), on every host, before a user sees the freeze."}, {"id": "query", "label": "Query job", "kind": "worker", "at": [14, -5], "hue": 18, "tech": "start_ui_job", "desc": "A query, an import or a sort on its own thread. It owns a snapshot of its inputs."}, {"id": "video", "label": "Video decoder", "kind": "worker", "at": [14, 0], "hue": 18, "tech": "FrameFeed", "desc": "A decoder thread per video: opens in about 40 µs, seeks in about 6 µs, the newest seek wins."}, {"id": "ocr", "label": "Document job", "kind": "worker", "at": [14, 5], "hue": 18, "tech": "OCR · packs", "desc": "Reading a folder of PDFs, drawing pages and writing claim packs, off the UI thread."}, {"id": "gpu", "label": "GPU", "kind": "service", "shape": "chip", "at": [21, -2.5], "hue": 95, "tech": "Mojo kernels", "desc": "The heavy lifting: group-bys, medians, image ops."}, {"id": "data", "label": "Data", "kind": "db", "at": [21, 3.5], "hue": 175, "tech": "omxcore tables", "desc": "Tables in memory and on the GPU."}], "zones": [{"id": "main", "label": "UI thread: decide fast", "nodes": ["ui", "watch"], "hue": 145}, {"id": "workers", "label": "job threads: do the slow part", "nodes": ["query", "video", "ocr"], "hue": 18}], "edges": [{"from": "screen", "to": "ui", "label": "tap"}, {"from": "ui", "to": "query", "style": "async", "label": "start"}, {"from": "ui", "to": "video", "style": "async", "label": "seek"}, {"from": "ui", "to": "ocr", "style": "async", "label": "read"}, {"from": "query", "to": "gpu"}, {"from": "query", "to": "data"}, {"from": "ocr", "to": "data"}, {"from": "watch", "to": "ui", "style": "data", "label": "times it"}], "flows": [{"name": "A slow query, a live window", "desc": "A tap asks for a median over 100M rows.", "steps": [{"from": "screen", "to": "ui", "note": "The tap reaches update() as an event."}, {"from": "ui", "to": "query", "note": "update() starts a job with a snapshot of what it needs, and returns at once."}, {"at": "screen", "note": "The window keeps drawing: the island shows progress every frame."}, {"from": "query", "to": "gpu", "note": "The job runs the median on the GPU."}, {"from": "query", "to": "ui", "note": "The job ends and wakes the main loop; update() hears it as an ordinary event."}, {"from": "ui", "to": "screen", "note": "view() draws the answer. Measured: a 1.5 s job, 90 frames while it ran, the longest gap 17 ms."}]}, {"name": "Scrubbing a video", "desc": "Dragging the playhead fast.", "steps": [{"from": "screen", "to": "ui", "note": "Each drag step is an event."}, {"from": "ui", "to": "video", "note": "update() asks the decoder thread to seek; it never waits for the frame."}, {"at": "video", "note": "Only the newest seek is decoded; older ones are dropped."}, {"from": "video", "to": "ui", "note": "The frame lands and wakes the UI."}, {"from": "ui", "to": "screen", "note": "The new frame is drawn in the next frame."}]}]}</script>
<script>
(() => {
"use strict";
const spec = JSON.parse(document.getElementById('spec').textContent);
const NS = 'http://www.w3.org/2000/svg';
const U = 30, C = Math.cos(Math.PI / 6), R2 = Math.SQRT2;
const svg = document.getElementById('svg');
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const STYLES = ['fieldnotes', 'ink', 'clean'];

/* ---------- kinds: colour + default shape ---------- */
const KINDS = {
  client:  {hue:215, sat:28, shape:'screen',   h:1.5, label:'Client'},
  edge:    {hue:178, sat:42, shape:'slab',     h:0.55,label:'Edge / gateway'},
  service: {hue:232, sat:52, shape:'box',      h:1.5, label:'Service'},
  worker:  {hue:268, sat:40, shape:'box',      h:1.2, label:'Worker / job'},
  ai:      {hue:312, sat:42, shape:'chip',     h:1.3, label:'Model / AI'},
  db:      {hue:36,  sat:72, shape:'cylinder', h:1.7, label:'Database'},
  cache:   {hue:6,   sat:60, shape:'cylinder', h:0.9, label:'Cache'},
  storage: {hue:198, sat:52, shape:'bucket',   h:1.0, label:'Object storage'},
  queue:   {hue:148, sat:40, shape:'stack',    h:1.3, label:'Queue / stream'},
  external:{hue:220, sat:5,  shape:'box',      h:1.0, label:'External / 3rd party'},
};
const EDGE_STYLES = {
  sync:  {dash:null,  label:'Request / response'},
  async: {dash:'7 5', label:'Async / event'},
  data:  {dash:'2 4', label:'Data / replication'},
};
const FLOOR_HUES = [120, 38, 205, 280, 12, 170];

/* ---------- state ---------- */
const S = {hover:null, sel:null, floorHot:null, flow:0, step:-1, playing:false, live:!reduceMotion && spec.live !== false,
           style:STYLES.includes(spec.style) ? spec.style : 'fieldnotes', fold:!!spec.folded, vb:null, anim:null, timer:null};
const FN = () => S.style === 'fieldnotes';

function isDark(){
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
function theme(){
  const d = isDark();
  if (FN()) return d
    ? {bg:'#221f1a', ink:'#eee5d2', muted:'#a99d88', edge:'#b9ad96', grid:'#2c2822', halo:'#221f1a', accent:'#e0847a', bug:'#ff6b6b', pill:'#2b2822', pillLine:'#eee5d2',
       nodeInk:'#141210', shadow:'#000000', shadowOp:.45, zone:.55, plinthTop:'#3b372f', plinthSide:'#2f2b25', thread:'#e0847a', ticketInk:'#eee5d2'}
    : {bg:'#ece3d0', ink:'#201d19', muted:'#6b6152', edge:'#5e5243', grid:'#e2d7c0', halo:'#ece3d0', accent:'#b35f5a', bug:'#c8323a', pill:'#fbf8ed', pillLine:'#201d19',
       nodeInk:'#201d19', shadow:'#767e9a', shadowOp:.55, zone:.55, plinthTop:'#f3e6c9', plinthSide:'#dcc9a3', thread:'#b35f5a', ticketInk:'#201d19'};
  return d
    ? {bg:'#14161b', ink:'#e8e9ee', muted:'#9aa0ac', edge:'#868c9c', grid:'#1f2229', halo:'#14161b', accent:'#8fa3ff', bug:'#ff6b6b', pill:'#1d2027', pillLine:'#30343f',
       nodeInk:'#0b0c0f', shadow:'#000000', shadowOp:.09, zone:0.10, thread:'#8fa3ff', ticketInk:'#e8e9ee'}
    : {bg:'#f5f3ee', ink:'#1d1f25', muted:'#6a6e78', edge:'#7c818e', grid:'#e6e2d8', halo:'#f5f3ee', accent:'#3d5bd9', bug:'#e5484d', pill:'#ffffff', pillLine:'#dcd8ce',
       nodeInk:'#24262c', shadow:'#1d1f25', shadowOp:.09, zone:0.16, thread:'#3d5bd9', ticketInk:'#1d1f25'};
}
const hsl = (h,s,l,a=1) => `hsla(${h},${s}%,${l}%,${a})`;
function colours(n){
  const K = n._K, h = n.hue ?? K.hue, d = isDark();
  let s = n.sat ?? K.sat, L = d ? [56,43,33] : [87,73,60];
  if (FN()){ s = Math.round(Math.min(s, 46) * 0.78); L = d ? [50,41,33] : [88,78,67]; }
  return {h, s, top:hsl(h,s,L[0]), left:hsl(h,s,L[1]), right:hsl(h,s,L[2]),
          glass: d ? hsl(205,40,72) : hsl(205,55,90), swatch:hsl(h,FN() ? s + 10 : s,d?55:62)};
}

/* ---------- projection + svg helpers ---------- */
let Z0 = 0;   // elevation of the floor being drawn
const P = (x,y,z=0) => [(x - y) * C * U, (x + y) * 0.5 * U - (z + Z0) * U];
const pts = a => a.map(p => P(...p).map(v => v.toFixed(1)).join(',')).join(' ');
const at = (z, f) => { const o = Z0; Z0 = z; try { return f(); } finally { Z0 = o; } };
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const dstr = (p, closed) => 'M' + p.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join('L') + (closed ? 'Z' : '');

/* ---------- hand: rounded, slightly wobbly pen lines (Field Notes) ---------- */
let SEED = 1;
function rnd(seed){ let t = seed >>> 0; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ t >>> 15, 1 | t); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
function densify(p, closed, r, step){
  const n = p.length, out = [];
  const corner = i => {
    const a = p[(i - 1 + n) % n], b = p[i], c = p[(i + 1) % n];
    const l1 = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, l2 = Math.hypot(c[0] - b[0], c[1] - b[1]) || 1;
    const k = Math.min(r, l1 * 0.45, l2 * 0.45);
    return [[b[0] - (b[0] - a[0]) / l1 * k, b[1] - (b[1] - a[1]) / l1 * k], b, [b[0] + (c[0] - b[0]) / l2 * k, b[1] + (c[1] - b[1]) / l2 * k]];
  };
  const line = (a, b) => { const L = Math.hypot(b[0] - a[0], b[1] - a[1]), m = Math.max(1, Math.ceil(L / step)); for (let j = 1; j <= m; j++) out.push([a[0] + (b[0] - a[0]) * j / m, a[1] + (b[1] - a[1]) * j / m]); };
  const bez = (a, b, c) => { for (let j = 1; j <= 4; j++){ const t = j / 4, u = 1 - t; out.push([u * u * a[0] + 2 * u * t * b[0] + t * t * c[0], u * u * a[1] + 2 * u * t * b[1] + t * t * c[1]]); } };
  if (n < 2) return p.slice();
  if (closed){
    const cs = p.map((_, i) => corner(i));
    out.push(cs[0][2]);
    for (let i = 1; i <= n; i++){ const c = cs[i % n]; line(out[out.length - 1], c[0]); if (r > 0) bez(c[0], c[1], c[2]); }
  } else {
    out.push(p[0]);
    for (let i = 1; i < n - 1; i++){ const c = corner(i); line(out[out.length - 1], c[0]); if (r > 0) bez(c[0], c[1], c[2]); }
    line(out[out.length - 1], p[n - 1]);
  }
  return out;
}
function hand(p, closed, o = {}){
  const q = densify(p, closed, o.r ?? 0, o.step ?? 8), amp = o.amp ?? 0.75;
  if (!amp || q.length < 3) return dstr(q, closed);
  const R = rnd(++SEED * 2654435761);
  let total = 0; const acc = [0];
  for (let i = 1; i < q.length; i++){ total += Math.hypot(q[i][0] - q[i - 1][0], q[i][1] - q[i - 1][1]); acc.push(total); }
  // closed lines use whole cycles so the end meets the start
  const cyc = f => closed ? Math.max(1, Math.round(total * f / 6.283)) * 6.283 / Math.max(1, total) : f;
  const f1 = cyc(0.045 + R() * 0.03), f2 = cyc(0.12 + R() * 0.06), a1 = R() * 6.283, a2 = R() * 6.283;
  const out = q.map((pt, i) => {
    const A = q[Math.max(0, i - 1)], B = q[Math.min(q.length - 1, i + 1)];
    const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy) || 1;
    const taper = closed ? 1 : Math.min(1, acc[i] / 10, (total - acc[i]) / 10);
    const k = amp * taper * (0.7 * Math.sin(acc[i] * f1 + a1) + 0.3 * Math.sin(acc[i] * f2 + a2));
    return [pt[0] - dy / L * k, pt[1] + dx / L * k];
  });
  return dstr(out, closed);
}

/* ---------- paper tooth: one grain tile, reused by every colour ---------- */
const TOOTH = {}, TN = 180;
function tooth(){
  const key = isDark() ? 'd' : 'l';
  if (TOOTH[key]) return TOOTH[key];
  const cv = document.createElement('canvas'); cv.width = cv.height = TN;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(TN, TN), R = rnd(4242);
  const grid = g => { const a = []; for (let i = 0; i < g * g; i++) a.push(R()); return (x, y) => {
    const gx = x / TN * g, gy = y / TN * g, x0 = Math.floor(gx), y0 = Math.floor(gy), fx = gx - x0, fy = gy - y0;
    const v = (i, j) => a[((j % g + g) % g) * g + ((i % g + g) % g)];
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    return (v(x0, y0) * (1 - sx) + v(x0 + 1, y0) * sx) * (1 - sy) + (v(x0, y0 + 1) * (1 - sx) + v(x0 + 1, y0 + 1) * sx) * sy; }; };
  const n1 = grid(30), n2 = grid(90), dark = isDark();
  for (let y = 0; y < TN; y++) for (let x = 0; x < TN; x++){
    // mostly fine grain, a little slow mottling: pencil catching the paper's tooth

/* ---------- statecharts: /statechart's Mermaid, drawn as tickets on red thread ---------- */
function parseChart(src){
  const lines = String(src).split(/\r?\n/);

  for (; i < lines.length; i++){

    if ((m = L.match(/^state\s+"([^"]*)"\s+as\s+([\w-]+)\s*(\{)?$/))){ parents[m[2]] = {id:m[2], label:m[1], parent:top()}; if (m[3]) stack.push(m[2]); continue; }
    if ((m = L.match(/^state\s+([\w-]+)\s*\{$/))){ parents[m[1]] = {id:m[1], label:m[1], parent:top()}; stack.push(m[1]); continue; }

    if ((m = L.match(/^(\[\*\]|[\w-]+)\s*-->\s*(\[\*\]|[\w-]+)\s*(?::\s*(.*))?$/))){
      const [, a, b, lab] = m;
      if (a === '[*]'){ if (b !== '[*]') starts.push(b); }
      else if (b !== '[*]') edges.push({a, b, label:(lab || '').trim()});

  }

function wrap(s, n){ const out = []; let cur = ''; String(s).split(/\s+/).forEach(w => { if (cur && (cur + ' ' + w).length > n){ out.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w; }); if (cur) out.push(cur); return out.length ? out : ['']; }
function chartSVG(src){

  Object.values(outs).forEach(l => l.sort((p, q) => tk[p.b].x - tk[q.b].x));
  Object.values(ins).forEach(l => l.sort((p, q) => tk[p.a].x - tk[q.a].x));

/* ---------- motion: ambient packets + flows ---------- */

  if (e) return {edge:e, path:e._full, len:e._len, rev:false, sp:e._sp, cross:e._cross, fi:e._fl};
  e = edges.find(e => e.from === st.to && e.to === st.from);

  const a = byId[st.from], b = byId[st.to];
  if (!a || !b) return null;
  const sp = lift3(buildRoute(a, b, st.route, 0), a.z, b.z).map(q => P(...q));
  const path = el('path', {d:dstr(sp), fill:'none', stroke:theme().accent,
    'stroke-width':2.2, 'stroke-dasharray':'3 5', 'stroke-linecap':'round', opacity:.9, class:'adhoc'}, layers.fx);
  return {edge:null, path, len:path.getTotalLength(), rev:false, sp, cross:a._fi !== b._fi, fi:a._fi};

let packets = [];
function seedAmbient(){

}
function makeAmbient(){ packets.forEach(p => { p._el = el('circle', {class:'amb', r:FN() ? 2.6 : 3.2, fill:p.e._col, opacity:0}, layers.amb); }); }
function drawAmbient(dt){
  const off = !S.live || currentStep(), id = S.hover || S.sel;
  packets.forEach(p => {
    if (!p._el) return;
    if (off){ p._el.setAttribute('opacity', 0); return; }
    p.t = (p.t + dt * p.speed * (90 / Math.max(60, p.e._len))) % 1;
    const pt = p.e._full.getPointAtLength(p.t * p.e._len);
    const fade = Math.min(1, p.t * 6, (1 - p.t) * 6);
    const k = id && p.e.from !== id && p.e.to !== id ? 0.15 : 0.85;
    p._el.setAttribute('cx', pt.x.toFixed(1)); p._el.setAttribute('cy', pt.y.toFixed(1));

let last = performance.now();
function tick(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  drawAmbient(dt);
  if (S.anim) S.anim(now);
  requestAnimationFrame(tick);

// the red trail a flow leaves behind it, like the Field Notes plates
function trailLayer(r){ return r.cross || r.fi == null || r.fi < 0 ? layers.xtrail : FL[r.fi].trail; }

function playStep(i, auto){

  const st = f.steps[S.step], lastStep = S.step === f.steps.length - 1;
  st._bug = !!f.bug;
  redrawTrails(f, S.step);
  const r = stepRoute(st);
  st._edge = r?.edge || null;
  focus(); caption();
  const T = theme(), col = f.bug ? T.bug : T.accent;
  const done = () => { if (lastStep && f.bug) stamp(f); };
  const next = () => {
    done();
    if (S.playing && auto){
      if (!lastStep) S.timer = setTimeout(() => playStep(S.step + 1, true), 650);
      else { S.timer = setTimeout(() => { setPlaying(false); }, 900); }
    }
  };
  if (!r){
    const n = byId[st.at || st.from || st.to];
    if (n){
      const [px, py] = at(n.z, () => P(n.cx, n.cy, n.h));
      const ring = el('ellipse', {class:'pk', cx:px, cy:py - 6, rx:10, ry:6, fill:'none', stroke:col, 'stroke-width':2.5}, layers.fx);
      const t0 = performance.now();
      S.anim = now => { const k = Math.min(1, (now - t0) / 1100); ring.setAttribute('rx', 10 + 40 * k); ring.setAttribute('ry', 6 + 23 * k); ring.setAttribute('opacity', 1 - k);
        if (k >= 1){ S.anim = null; ring.remove(); next(); } };
    } else next();
    return;
  }
  const tr = trail(r, f, true);
  const glow = el('circle', {class:'pk', r:9, fill:col, opacity:.45, filter:'url(#glow)'}, layers.fx);
  const dot = el('circle', {class:'pk', r:FN() ? 5.5 : 5, fill:col, stroke:FN() ? T.ink : T.halo, 'stroke-width':FN() ? 1.2 : 1.5}, layers.fx);
  const dur = reduceMotion ? 1 : Math.max(650, Math.min(1700, 380 + r.len * 2.4)), t0 = performance.now();
  S.anim = now => {
    let k = Math.min(1, (now - t0) / dur); const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const pt = r.path.getPointAtLength((r.rev ? 1 - e : e) * r.len);
    [dot, glow].forEach(c => { c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); });
    tr.p.setAttribute('stroke-dashoffset', (tr.L * (1 - e)).toFixed(1));
    if (k >= 1){ S.anim = null; tr.p.removeAttribute('stroke-dasharray'); tr.p.removeAttribute('stroke-dashoffset'); setTimeout(() => { dot.remove(); glow.remove(); }, 500); next(); }
  };
}
function caption(){
  const f = flows[S.flow], st = currentStep();
  const n = f ? f.steps.length : 0;
  const tag = st?.state ? `<span class="st">${esc(st.state)}</span>` : '';
  const brk = st && f.bug && S.step === n - 1 ? ` <span class="brk">✕ breaks: ${esc(f.bug)}</span>` : '';
  $('caption').innerHTML = st ? `<b>${S.step + 1}/${n}</b>${esc(st.note || `${byId[st.from]?.label || st.from} → ${byId[st.to]?.label || st.to}`)}${tag}${brk}`
    : (f ? `<span style="color:var(--muted)">${esc(f.desc || (f.bug ? `A path that breaks the rule: ${f.bug}. Press play.` : 'Press play to walk through this flow step by step.'))}</span>` : '');
  $('dots').classList.toggle('bug', !!f?.bug);
  $('dots').innerHTML = f ? f.steps.map((_, i) => `<i class="${i <= S.step ? 'on' : ''}" data-i="${i}" title="Step ${i + 1}"></i>`).join('') : '';
  $('dots').querySelectorAll('i').forEach(d => d.onclick = () => { setPlaying(false); playStep(+d.dataset.i, false); });
}
function setPlaying(on){
  S.playing = on; $('bPlay').textContent = on ? '❚❚ Pause' : '▶ Play';
  if (on){ const f = flows[S.flow]; playStep(S.step < 0 || S.step >= f.steps.length - 1 ? 0 : S.step + 1, true); }
  else clearTimeout(S.timer);
}
function resetFlow(){ setPlaying(false); S.anim = null; S.step = -1; if (layers.fx) layers.fx.querySelectorAll('.adhoc,.pk').forEach(n => n.remove()); clearTrails(); focus(); caption(); }

/* ---------- legend ---------- */
function legend(){
  const kinds = [...new Set(nodes.map(n => n.kind && KINDS[n.kind] ? n.kind : 'service'))];
  const styles = [...new Set(edges.map(e => EDGE_STYLES[e.style] ? e.style : 'sync'))];
  const T = theme();
  const sw = k => { const K = KINDS[k]; return colours({_K:K}).swatch; };
  $('legend').innerHTML = kinds.map(k => `<span class="c"><i class="sw" style="background:${sw(k)}"></i>${KINDS[k].label}</span>`).join('')
    + (styles.length > 1 ? styles.map(s => `<span class="c"><svg viewBox="0 0 22 8"><line x1="1" y1="4" x2="21" y2="4" stroke="${T.edge}" stroke-width="2" ${EDGE_STYLES[s].dash ? `stroke-dasharray="${EDGE_STYLES[s].dash.split(' ').map(v => v / 2).join(' ')}"` : ''}/></svg>${EDGE_STYLES[s].label}</span>`).join('') : '')
    + (nodes.some(n => n.chart) ? `<span class="c"><b style="color:${T.accent}">◆</b> has a statechart (click it)</span>` : '')
    + (flows.some(f => f.bug) ? `<span class="c"><svg viewBox="0 0 22 8"><line x1="1" y1="4" x2="21" y2="4" stroke="${T.bug}" stroke-width="4" stroke-linecap="round" opacity=".7"/></svg>Path that breaks a rule</span>` : '');
}

/* ---------- export ---------- */
function exportSVG(){
  const c = svg.cloneNode(true), T = theme();
  c.querySelectorAll('.pk,.adhoc,.amb').forEach(n => n.remove());
  const b = document.getElementById('root').getBBox(), pad = 30;
  c.setAttribute('viewBox', `${b.x - pad} ${b.y - pad} ${b.width + pad * 2} ${b.height + pad * 2}`);
  c.setAttribute('width', Math.round(b.width + pad * 2)); c.setAttribute('height', Math.round(b.height + pad * 2));
  c.setAttribute('font-family', FN() ? 'ui-monospace, "SF Mono", Menlo, Consolas, monospace' : 'system-ui, -apple-system, Segoe UI, Roboto, sans-serif');
  c.querySelectorAll('.dim').forEach(n => n.classList.remove('dim'));
  const bg = el('rect', {x:b.x - pad, y:b.y - pad, width:b.width + pad * 2, height:b.height + pad * 2, fill:T.bg});
  c.insertBefore(bg, c.querySelector('#root'));
  if (FN()){
    const p = el('pattern', {id:'paperbg', patternUnits:'userSpaceOnUse', width:TN, height:TN}, c.querySelector('defs'));
    el('use', {href:'#tooth'}, p);
    c.insertBefore(el('rect', {x:b.x - pad, y:b.y - pad, width:b.width + pad * 2, height:b.height + pad * 2, fill:'url(#paperbg)'}), c.querySelector('#root'));
  }
  return new XMLSerializer().serializeToString(c);
}
const slug = () => (spec.title || 'architecture').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function download(url, name){ const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
$('bSvg').onclick = () => { const u = URL.createObjectURL(new Blob([exportSVG()], {type:'image/svg+xml'})); download(u, slug() + '.svg'); setTimeout(() => URL.revokeObjectURL(u), 2000); };
$('bPng').onclick = () => {
  const s = exportSVG(), img = new Image();
  img.onload = () => { const k = 2, cv = document.createElement('canvas'); cv.width = img.width * k; cv.height = img.height * k;
    const ctx = cv.getContext('2d'); ctx.scale(k, k); ctx.drawImage(img, 0, 0); download(cv.toDataURL('image/png'), slug() + '.png'); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
};

/* ---------- controls ---------- */
$('bLive').setAttribute('aria-pressed', S.live);
$('styleSel').value = S.style;
$('bLive').onclick = () => { S.live = !S.live; $('bLive').setAttribute('aria-pressed', S.live); };
$('styleSel').onchange = () => { S.style = $('styleSel').value; rerender(); fit(); };
$('bTheme').onclick = () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; rerender(); };
$('bFit').onclick = () => fit();
if (floors.length){
  $('bFold').hidden = false;
  const lbl = () => { $('bFold').textContent = S.fold ? 'Explode floors' : 'Fold floors'; };
  lbl();
  $('bFold').onclick = () => { S.fold = !S.fold; lbl(); rerender(); fit(); };
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => rerender());
function rerender(){
  const step = S.step; S.anim = null; render(); legend(); showInfo();
  if (step >= 0){ S.step = step; const f = flows[S.flow]; redrawTrails(f, step + 1); if (f.bug && step === f.steps.length - 1) stamp(f); focus(); caption(); }
}
addEventListener('keydown', ev => {
  if (!flows.length || ev.target.tagName === 'SELECT') return;
  if (ev.key === ' '){ ev.preventDefault(); setPlaying(!S.playing); }
  if (ev.key === 'ArrowRight'){ setPlaying(false); playStep(S.step + 1, false); }
  if (ev.key === 'ArrowLeft'){ setPlaying(false); playStep(S.step - 1, false); }
  if (ev.key === 'Escape'){ S.sel = null; S.floorHot = null; showInfo(); resetFlow(); }
});
if (flows.length){
  $('flowbar').hidden = false;
  $('flowSel').innerHTML = flows.map((f, i) => `<option value="${i}">${f.bug ? '✕ ' : ''}${esc(f.name || 'Flow ' + (i + 1))}</option>`).join('');
  if (flows.length < 2) $('flowSel').style.display = 'none';
  $('flowSel').onchange = () => { S.flow = +$('flowSel').value; resetFlow(); };
  $('bPlay').onclick = () => setPlaying(!S.playing);
  $('bNext').onclick = () => { setPlaying(false); playStep(S.step + 1, false); };
  $('bPrev').onclick = () => { setPlaying(false); playStep(S.step - 1, false); };
  flows.forEach(f => f.steps.forEach(st => [st.from, st.to, st.at].forEach(id => { if (id && !byId[id]) warnings.push(`flow "${f.name}": unknown node ${id}`); })));
}

/* ---------- boot ---------- */
$('title').textContent = spec.title || 'Architecture';
$('subtitle').textContent = spec.subtitle || '';
document.title = spec.title || 'Architecture';
document.documentElement.dataset.style = S.style;
layout(); layoutZones();
seedAmbient(); render(); legend(); caption();
addEventListener('resize', () => fit());
requestAnimationFrame(tick);
window.__isoarch = {warnings: [...new Set(warnings)], ready: true, play:(flow = 0, step = 0) => { S.flow = flow; $('flowSel').value = flow; playStep(step, false); },
  select:id => select(id), fold:on => { S.fold = !!on; rerender(); fit(); }, style:s => { S.style = s; $('styleSel').value = s; rerender(); fit(); }};
})();
</script>
</body>
