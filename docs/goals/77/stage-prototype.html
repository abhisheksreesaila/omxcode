<title>omx Counter Look</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Fredoka:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=DM+Serif+Display&display=swap">
<style>
/* PROTOTYPE (throwaway): three layouts of the omx kitchen-counter assistant, one translucent look, one liquid motion.
   Layout concept: the wallpaper is the room; translucent glass carries the chrome; solid soft white cards carry the answers.
   Motion tokens copied from GitAway (gitaway.me, assets/css/tokens.css): grow from the tap, fold back, settle, zoom. */
:root {
  /* the room: a layered landscape (Apple TV depth); materials on top of it */
  --sky-a: #6fa6e6; --sky-b: #b9daf8; --sky-c: #fde6c8; --glow: #fff1d6; --sun: #fffaf0; --stars: 0;
  --far: #9db7cf; --mid: #84ad8c; --near: #4f845b; --scrim: rgba(236, 242, 250, .4); --wall-a: var(--sky-a);
  --glass: rgba(250, 252, 255, .5); --glass-rim: rgba(255, 255, 255, .6); --glass-ink: #121821;
  --tile: rgba(255, 255, 255, .78); --tile-rim: rgba(255, 255, 255, .75);
  --sheet: #ffffff; --raised: #f1f4f8; --ink: #121821; --ink-2: #5a6370; --ink-3: #98a0ab; --line: rgba(20, 30, 45, .08);
  --accent: #2f6bff; --accent-soft: rgba(47, 107, 255, .12); --accent-ink: #ffffff;
  --good: #1f9d55; --warm: #e8a33a; --ring: #2f6bff;
  --iso-top: #eef3fb; --iso-left: #c9d7ee; --iso-right: #a9bfe3; --iso-warm-top: #fbefe1; --iso-warm-left: #f1d2ad; --iso-warm-right: #e5b783;
  --land: #eef0e6; --water: #b9d6ec; --street: #ffffff; --park: #cfe3c0;
  --shadow: 0 1px 2px rgba(15, 25, 40, .05), 0 14px 34px rgba(15, 25, 40, .12);
  --shadow-lift: 0 2px 6px rgba(15, 25, 40, .08), 0 28px 64px rgba(15, 25, 40, .24);
  --glass-shadow: inset 0 1px rgba(255, 255, 255, .75), inset 0 -1px rgba(255, 255, 255, .18), 0 0 0 1px var(--glass-rim), 0 18px 50px rgba(15, 30, 50, .16);
  --tile-shadow: inset 0 1px rgba(255, 255, 255, .9), 0 0 0 1px var(--tile-rim), 0 10px 30px rgba(15, 30, 50, .10);
  --font: "Inter", -apple-system, "SF Pro Text", system-ui, sans-serif;
  --display: "Fraunces", "Iowan Old Style", Georgia, serif;
  /* motion (GitAway): what grows, what folds, what settles, what zooms, small glides */
  --motion-spring-dur: 380ms; --motion-spring: cubic-bezier(.3, 1.12, .4, 1);
  --motion-dur: 240ms; --motion-out: cubic-bezier(.4, 0, .8, .4); --motion-ease: cubic-bezier(.25, .8, .25, 1);
  --motion-settle-dur: 280ms; --motion-screen-dur: 340ms; --motion-zoom: cubic-bezier(.22, 1, .36, 1);
  --motion-quick: 160ms; --motion-fade: 120ms;
  --switch-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sky-a: #050816; --sky-b: #121a3d; --sky-c: #34295a; --glow: #6a4a8c; --sun: #f3efe4; --stars: 1;
  --far: #1b2547; --mid: #111a35; --near: #080d1f; --scrim: rgba(3, 5, 12, .45);
  --glass: rgba(24, 28, 42, .46); --glass-rim: rgba(255, 255, 255, .12); --glass-ink: #f2f4fa;
  --tile: rgba(22, 26, 40, .58); --tile-rim: rgba(255, 255, 255, .09);
  --sheet: #161922; --raised: #222633; --ink: #f2f4fa; --ink-2: #a6adba; --ink-3: #6b7280; --line: rgba(255, 255, 255, .08);
  --accent: #8aa8ff; --accent-soft: rgba(138, 168, 255, .16); --accent-ink: #0a1020; --ring: #a8bdff; --good: #3ccf7f;
  --iso-top: #2d3442; --iso-left: #232936; --iso-right: #1b202b; --iso-warm-top: #4a3b2a; --iso-warm-left: #3a2e21; --iso-warm-right: #2d2419;
  --land: #262a26; --water: #1d3346; --street: #353a36; --park: #2b3a2a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 16px 40px rgba(0, 0, 0, .4);
  --shadow-lift: 0 2px 8px rgba(0, 0, 0, .45), 0 32px 80px rgba(0, 0, 0, .6);
  --glass-shadow: inset 0 1px rgba(255, 255, 255, .14), inset 0 -1px rgba(255, 255, 255, .04), 0 0 0 1px var(--glass-rim), 0 20px 56px rgba(0, 0, 0, .5);
  --tile-shadow: inset 0 1px rgba(255, 255, 255, .08), 0 0 0 1px var(--tile-rim), 0 14px 40px rgba(0, 0, 0, .35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --sky-a: #050816; --sky-b: #121a3d; --sky-c: #34295a; --glow: #6a4a8c; --sun: #f3efe4; --stars: 1;
  --far: #1b2547; --mid: #111a35; --near: #080d1f; --scrim: rgba(3, 5, 12, .45);
  --glass: rgba(24, 28, 42, .46); --glass-rim: rgba(255, 255, 255, .12); --glass-ink: #f2f4fa;
  --tile: rgba(22, 26, 40, .58); --tile-rim: rgba(255, 255, 255, .09);
  --sheet: #161922; --raised: #222633; --ink: #f2f4fa; --ink-2: #a6adba; --ink-3: #6b7280; --line: rgba(255, 255, 255, .08);
  --accent: #8aa8ff; --accent-soft: rgba(138, 168, 255, .16); --accent-ink: #0a1020; --ring: #a8bdff; --good: #3ccf7f;
  --iso-top: #2d3442; --iso-left: #232936; --iso-right: #1b202b; --iso-warm-top: #4a3b2a; --iso-warm-left: #3a2e21; --iso-warm-right: #2d2419;
  --land: #262a26; --water: #1d3346; --street: #353a36; --park: #2b3a2a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 16px 40px rgba(0, 0, 0, .4);
  --shadow-lift: 0 2px 8px rgba(0, 0, 0, .45), 0 32px 80px rgba(0, 0, 0, .6);
  --glass-shadow: inset 0 1px rgba(255, 255, 255, .14), inset 0 -1px rgba(255, 255, 255, .04), 0 0 0 1px var(--glass-rim), 0 20px 56px rgba(0, 0, 0, .5);
  --tile-shadow: inset 0 1px rgba(255, 255, 255, .08), 0 0 0 1px var(--tile-rim), 0 14px 40px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 650ms; animation-timing-function: cubic-bezier(.25, .8, .25, 1); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--wall-a); color: var(--ink); font: 400 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* the room: a soft landscape wallpaper with a little grain */
.wall { position: fixed; inset: -4%; z-index: 0; overflow: hidden; background: var(--sky-a); }
.wall .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; will-change: transform; }
.wall::after { content: ""; position: absolute; inset: 0; opacity: .1; mix-blend-mode: overlay; background-image: var(--grain); }

.glass { background: var(--glass); -webkit-backdrop-filter: blur(26px) saturate(1.8); backdrop-filter: blur(26px) saturate(1.8); box-shadow: var(--glass-shadow); color: var(--glass-ink); }
.app { position: fixed; inset: 0; z-index: 1; padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--switch-h));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- shared pieces ---------- */
.orb { display: block; aspect-ratio: 1; width: 100%; }
.orb-box { flex: none; }
.state { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.you { font-size: 13px; color: var(--ink-2); margin-top: 2px; min-height: 1.2em; }
.said { font-size: 19px; line-height: 1.35; font-weight: 600; color: var(--ink); letter-spacing: -.01em; text-wrap: pretty; min-height: 1.35em; }
.said .w { display: inline-block; animation: wordIn var(--motion-quick) var(--motion-ease) both; }
@keyframes wordIn { from { opacity: 0; transform: translateY(4px); } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px 0 11px; border-radius: 999px; font-size: 13.5px; font-weight: 500;
  background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.7); backdrop-filter: blur(20px) saturate(1.7); box-shadow: var(--glass-shadow); color: var(--glass-ink);
  transition: transform var(--motion-quick) var(--motion-spring); }
.chip svg.i { width: 16px; height: 16px; color: var(--accent); }
.chip:active { transform: scale(.95); }
.lane { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; }
.lane::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
.mic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 40%, transparent); transition: transform var(--motion-quick) var(--motion-spring); flex: none; }
.mic:active { transform: scale(.92); }
.mic svg.i { width: 22px; height: 22px; }

/* cards: solid soft sheets on the glass */
.card { position: relative; background: var(--sheet); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; transform-origin: 0 0; }
.card .in { transform-origin: 0 0; }
.c-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 6px; }
.c-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.c-ico svg.i { width: 17px; height: 17px; }
.c-title { font-weight: 650; font-size: 16px; letter-spacing: -.01em; color: var(--ink); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-tag { font-size: 11.5px; font-weight: 600; color: var(--ink-2); background: var(--raised); padding: 3px 9px; border-radius: 999px; }
.c-body { padding: 6px 18px 18px; }
[data-part] { transition: background-color var(--motion-quick) var(--motion-ease), color var(--motion-quick) var(--motion-ease); border-radius: 10px; }
.pointed { background-color: var(--accent-soft); }

/* the pointer ring */
.ring { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; border-radius: 14px; border: 2.5px solid var(--ring);
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--ring) 16%, transparent), 0 8px 26px color-mix(in srgb, var(--ring) 30%, transparent); opacity: 0; will-change: transform, width, height; }

/* word card */
.word-big { font-family: var(--display); font-weight: 600; font-size: clamp(44px, 9vw, 72px); line-height: 1; letter-spacing: -.02em; color: var(--ink); padding: 4px 6px; margin: 4px -6px 0; display: inline-block; }
.word-big span { display: inline-block; animation: letterIn var(--motion-spring-dur) var(--motion-spring) both; }
@keyframes letterIn { from { opacity: 0; transform: translateY(14px) scale(.9); } }
.word-meta { display: flex; gap: 10px; align-items: center; margin: 8px 0 14px; color: var(--ink-2); font-size: 14px; }
.word-meta .pos { font-style: italic; }
.word-row { padding: 8px 10px; margin: 0 -10px; }
.word-row small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 2px; }
.word-row p { margin: 0; font-size: 16.5px; color: var(--ink); }
.word-row em { font-style: normal; font-weight: 650; color: var(--accent); }

/* to-do card */
.todo { display: flex; flex-direction: column; gap: 2px; }
.todo-row { display: flex; align-items: center; gap: 12px; padding: 10px; margin: 0 -10px; font-size: 16px; text-align: left; width: calc(100% + 20px); }
.todo-row .box { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--ink-3); display: grid; place-items: center; flex: none; transition: background var(--motion-quick), border-color var(--motion-quick); }
.todo-row .box svg { width: 15px; height: 15px; stroke: var(--accent-ink); stroke-width: 2.6; fill: none; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset var(--motion-spring-dur) var(--motion-spring); }
.todo-row.done .box { background: var(--accent); border-color: var(--accent); }
.todo-row.done .box svg { stroke-dashoffset: 0; }
.todo-row.done .t { color: var(--ink-3); text-decoration: line-through; }

/* map card */
.map { position: relative; border-radius: 16px; overflow: hidden; background: var(--water); aspect-ratio: 16 / 10; max-width: 100%; }
.map svg { width: 100%; height: 100%; display: block; }
.stops { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; }
.stop { display: flex; gap: 10px; align-items: baseline; padding: 7px 10px; margin: 0 -10px; }
.stop b { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-size: 12px; flex: none; transform: translateY(4px); }
.stop span { color: var(--ink-2); font-size: 14px; }
.stop strong { font-weight: 600; color: var(--ink); }

/* iso card */
.iso svg { width: 100%; height: auto; display: block; overflow: visible; }
.iso .blk { transition: transform var(--motion-spring-dur) var(--motion-spring); }
.iso .blk.up { transform: translateY(-8px); }
.iso-steps { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 2px; counter-reset: s; }
.iso-steps li { counter-increment: s; display: flex; gap: 10px; padding: 7px 10px; margin: 0 -10px; color: var(--ink-2); font-size: 14.5px; }
.iso-steps li::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--raised); color: var(--ink-2); font-size: 12px; font-weight: 600; flex: none; }
.iso-steps li.on { color: var(--ink); }
.iso-steps li.on::before { background: var(--accent); color: var(--accent-ink); }

/* camera card */
.cam { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; background: #2a2622; }
.cam svg { width: 100%; height: 100%; display: block; }
.cam .box { position: absolute; border: 2px solid #fff; border-radius: 12px; box-shadow: 0 0 0 1px rgba(0,0,0,.2); animation: boxIn var(--motion-spring-dur) var(--motion-spring) both; }
.cam .box i { position: absolute; left: 6px; top: -13px; font-style: normal; font-size: 12px; font-weight: 600; background: #fff; color: #1d1d1f; padding: 2px 8px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
@keyframes boxIn { from { opacity: 0; transform: scale(1.15); } }
.cam-note { font-size: 12.5px; color: var(--ink-2); margin-top: 10px; display: flex; gap: 6px; align-items: center; }

/* thumbnails */
.thumb { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 14px; text-align: left; min-width: 0; transition: background var(--motion-quick); }
.thumb .c-ico { width: 32px; height: 32px; }
.thumb b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb small { display: block; font-size: 11.5px; color: var(--ink-2); }
.thumb.on { background: color-mix(in srgb, var(--sheet) 70%, transparent); }

/* ---------- A · Stage: one answer at a time, front and centre ---------- */
.v-stage { display: flex; flex-direction: column; gap: 14px; padding-block: 12px; }
.v-stage .bar { display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 16px; border-radius: 18px; max-width: 980px; width: 100%; margin: 0 auto; }
.v-stage .brand { font-weight: 700; letter-spacing: -.02em; font-size: 17px; }
.v-stage .bar .lane { margin-left: auto; }
.v-stage .talk { display: flex; gap: 16px; align-items: center; max-width: 980px; width: 100%; margin: 0 auto; }
.v-stage .talk .orb-box { width: 84px; transition: width var(--motion-screen-dur) var(--motion-zoom); }
.v-stage.home .talk { flex-direction: column; text-align: center; margin-top: 6vh; }
.v-stage.home .talk .orb-box { width: 200px; }
.v-stage .talk .words { min-width: 0; flex: 1; }
.v-stage.home .talk .words { flex: none; }
.v-stage .stage { flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 4px 2px 12px; }
.v-stage .stage .card { width: min(680px, 100%); }
.v-stage .dock { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 24px; max-width: 980px; width: 100%; margin: 0 auto; }
.v-stage .dock .thumbs { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.v-stage .dock .thumb { flex: 0 0 auto; max-width: 200px; }
.v-stage .ask { max-width: 980px; width: 100%; margin: 0 auto; }
.v-stage.home .ask .chips { justify-content: center; }

/* ---------- B · Sidebar: the Mac reference, history on the left ---------- */
.v-side { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; padding-block: 12px; height: 100%; }
.v-side .side { border-radius: 24px; padding: 18px 14px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.v-side .side .me { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
.v-side .side .me .orb-box { width: 64px; }
.v-side .side h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); padding: 0 6px; }
.v-side .side .list { display: flex; flex-direction: column; gap: 2px; overflow: auto; min-height: 0; flex: 1; }
.v-side .side .chips { flex-direction: column; align-items: stretch; }
.v-side .side .chip { background: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; height: 38px; border-radius: 12px; justify-content: flex-start; }
.v-side .side .chip:hover { background: color-mix(in srgb, var(--sheet) 55%, transparent); }
.v-side .side .mic { width: 100%; height: 46px; border-radius: 14px; display: flex; gap: 8px; justify-content: center; font-weight: 600; }
.v-side .main { display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: auto; padding: 8px 4px 16px; }
.v-side .main .head { max-width: 760px; }
.v-side .main .said { font-size: 24px; }
.v-side .main .card { max-width: 760px; width: 100%; }

/* ---------- C · Board: every answer stays on the counter as a tile ---------- */
.v-board { display: flex; flex-direction: column; gap: 14px; padding-block: 12px; height: 100%; }
.v-board .top { display: flex; align-items: center; gap: 12px; }
.v-board .top h2 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.02em; color: var(--glass-ink); text-shadow: 0 1px 12px color-mix(in srgb, var(--wall-a) 60%, transparent); }
.v-board .top .lane { margin-left: auto; padding: 8px 14px; border-radius: 999px; }
.v-board .grid { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 16px; align-content: start; padding: 2px 2px 120px; }
.v-board .grid .card { cursor: pointer; }
.v-board .grid .card.open { grid-column: 1 / -1; cursor: default; }
.v-board .grid .card.open .c-body { max-width: 820px; }
.v-board .grid .card:not(.open) .c-body { max-height: 260px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.v-board .pill { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--switch-h) + 12px); transform: translateX(-50%); width: min(760px, calc(100% - 32px));
  border-radius: 28px; padding: 10px 10px 10px 12px; display: flex; flex-direction: column; gap: 10px; z-index: 5; }
.v-board .pill .row { display: flex; align-items: center; gap: 12px; }
.v-board .pill .orb-box { width: 56px; }
.v-board .pill .words { flex: 1; min-width: 0; }
.v-board .pill .said { font-size: 16px; }
.v-board .pill .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.v-board .pill .chip { flex: none; background: color-mix(in srgb, var(--sheet) 55%, transparent); box-shadow: none; }

/* ---------- D · One surface: the screen follows the moment (glance, jam, show me, check) ---------- */
.v-flow { position: relative; height: 100%; }
.v-flow .home { position: absolute; inset: 0; overflow: auto; padding: 14px 2px 110px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: none;
  transform-origin: 50% 30%; transition: transform var(--motion-screen-dur) var(--motion-zoom), opacity var(--motion-screen-dur) var(--motion-zoom); }
.v-flow:not(.glance) .home { transform: scale(.94); opacity: .22; pointer-events: none; }
.v-flow .hello { display: flex; align-items: flex-end; gap: 18px; color: var(--glass-ink); flex-wrap: wrap; }
.v-flow .hello .time { font: 600 clamp(52px, 8vw, 88px)/.95 var(--display); letter-spacing: -.03em; text-shadow: 0 2px 18px color-mix(in srgb, var(--wall-a) 70%, transparent); }
.v-flow .hello .date { font-size: 19px; font-weight: 650; }
.v-flow .hello .wx { font-size: 15px; color: color-mix(in srgb, var(--glass-ink) 75%, transparent); }
.v-flow .hello .lane { margin-left: auto; padding: 8px 14px; border-radius: 999px; }
.v-flow .tiles { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }

/* ---- E · Frame: a photo frame first; one card rises when spoken to; memories become chips ---- */
.v-frame { position: fixed; inset: 0; }

.fr-slide .art svg { width: 100%; height: 100%; display: block; }
.fr-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, .42), transparent 32%, transparent 58%, rgba(0, 0, 0, .5)); }

.fr-cap { position: fixed; left: 24px; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--switch-h) + 76px); z-index: 2; color: #fff; text-shadow: 0 2px 16px rgba(0, 0, 0, .4); transition: opacity var(--motion-dur); }

.fr-stage { position: fixed; left: 16px; right: 16px; top: 120px; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--switch-h) + 80px); z-index: 3; display: flex; justify-content: center; align-items: flex-start; overflow: auto; scrollbar-width: none; pointer-events: none; }

/* ---- F · River: the day as a river; now in the middle; answers drop in at now and drift into the past ---- */
.v-river { position: fixed; inset: 0; display: flex; flex-direction: column; }
.rv-top { padding: calc(env(safe-area-inset-top, 0px) + 18px) 24px 0; display: flex; align-items: flex-end; gap: 16px; color: var(--glass-ink); flex: none; }

.rv-row::before { content: ""; position: absolute; left: 0; right: 0; bottom: 22px; height: 2px; background: linear-gradient(90deg, transparent, var(--accent) 8%, var(--accent) 92%, transparent); opacity: .45; }

.rv-big { flex: none; width: min(560px, 84vw); }
.rv-big .card { max-height: calc(100vh - 300px); overflow: auto; }

/* ---- G · Orbit: she sits in the middle; everything orbits her in depth; an answer comes to the front ---- */
.v-orbit { position: fixed; inset: 0; }
.ob-top { position: fixed; left: 24px; top: calc(env(safe-area-inset-top, 0px) + 18px); z-index: 2; color: var(--glass-ink); display: flex; gap: 16px; align-items: flex-end; }
.ob-ring { position: fixed; inset: 0; z-index: 2; touch-action: pan-y; }

  transition: transform var(--motion-spring-dur) var(--motion-spring), opacity var(--motion-screen-dur) var(--motion-ease); will-change: transform; }

.ob-stage .card { width: min(620px, 100%); max-height: 100%; overflow: auto; pointer-events: auto; box-shadow: var(--shadow-lift); }

/* ---- H · Companion: she is the interface; she talks in a bubble and holds up what she's showing ---- */
.v-comp { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 4vw; padding: 96px 24px calc(env(safe-area-inset-bottom, 0px) + var(--switch-h) + 40px); }

.cp-bub { position: relative; border-radius: 28px; padding: 18px 22px 16px; max-width: 520px; }
.cp-bub::before { content: ""; position: absolute; left: -9px; top: 50%; width: 18px; height: 18px; margin-top: -9px; transform: rotate(45deg); background: inherit; border-radius: 4px; }

.cp-bub .you { font-size: 13px; }

.v-comp.holding .cp-me { width: min(24vh, 18vw); }
.v-comp.holding .cp-bub { max-width: 100%; }
.v-comp.holding .cp-bub::before { left: 40px; top: -9px; margin-top: 0; }
.v-comp.holding .cp-bub .said { font-size: 17px; }

@media (max-width: 760px) {
  .v-comp, .v-comp.holding { flex-direction: column; justify-content: flex-start; gap: 16px; padding-top: 110px; overflow: auto; }

/* ---- K · Home: live tiles, solid (no glass, no shimmer); Apple depth or Windows-calm flat; sizes flow like water ---- */
:root { --k-surface: #ffffff; --k-paper: #f2f2f5; --k-fill: #ededf1; --k-ink: #0b0b0d; --k-ink2: #5c5c66;

.v-home .lt-why svg.i { display: none; }

.v-home .lt-top .brand, .v-home .lt.lt-clock { color: var(--glass-ink); }

/* flat: Windows-calm, no shadows, the big tile is a solid colour */
:root[data-surface="flat"] .v-home .lt-bg, :root[data-surface="flat"] .v-home .lt.lt-me, :root[data-surface="flat"] .v-home .lt-moments, :root[data-surface="flat"] .v-home .lt-surf { box-shadow: none; }

/* profiles: who's here; each one has a theme, a voice and a model */
.pf-row { display: flex; align-items: center; gap: 6px; flex: none; }
.pf { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; background: var(--pc); box-shadow: 0 0 0 2px var(--k-surface), var(--k-sh);
  transition: transform var(--motion-settle-dur) var(--motion-spring), box-shadow var(--motion-quick); }
.pf.on { transform: scale(1.12); box-shadow: 0 0 0 2px var(--k-surface), 0 0 0 4.5px var(--pc), var(--k-sh); }
.pf-more { height: 40px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--k-surface); color: var(--k-ink); box-shadow: var(--k-sh); display: inline-flex; align-items: center; gap: 6px; }
.lt-moments { min-width: 0; flex: 0 1 auto; }
.pf-sheet { position: relative; width: min(760px, calc(100% - 32px)); max-height: calc(100% - 140px); overflow: auto; z-index: 25; border-radius: 30px;
  background: var(--k-surface); color: var(--k-ink); box-shadow: var(--k-sh-up); padding: 22px 22px 18px; }
.pf-scrim { position: fixed; inset: 0; z-index: 24; background: rgba(10, 10, 20, .28); display: grid; place-items: center; padding-bottom: var(--switch-h); }
.pf-sheet h3 { margin: 0; font-size: 22px; letter-spacing: -.02em; display: flex; align-items: center; gap: 12px; } .pf-sheet h3 .pf { width: 44px; height: 44px; }
.pf-sheet .lbl2 { font-size: 11.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--k-ink2); margin: 18px 0 8px; }
.pf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pf-th { border-radius: 16px; overflow: hidden; text-align: left; background: var(--k-fill, #eee); box-shadow: inset 0 0 0 2px transparent; transition: box-shadow var(--motion-quick); }
.pf-th.on { box-shadow: inset 0 0 0 3px var(--accent); }
.pf-th .pv { aspect-ratio: 16 / 10; display: block; position: relative; overflow: hidden; } .pf-th .pv svg { width: 100%; height: 100%; display: block; }
.pf-th b { display: block; padding: 8px 10px 9px; font-size: 13.5px; }
.pf-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pf-chips button { height: 38px; padding: 0 14px; border-radius: 999px; font-size: 13.5px; font-weight: 600; background: var(--k-fill, #eee); color: var(--k-ink); }
.pf-chips button.on { background: var(--k-ink); color: var(--k-surface); }
.pf-note { font-size: 13px; color: var(--k-ink2); margin-top: 8px; line-height: 1.4; }
.pf-x { position: absolute; right: 14px; top: 14px; width: 40px; height: 40px; border-radius: 50%; background: var(--k-fill, #eee); display: grid; place-items: center; color: var(--k-ink); }
@media (max-width: 760px) { .pf { width: 34px; height: 34px; font-size: 12px; } .pf-more span { display: none; } }

/* ---- press: everything you touch goes in and springs back (omxqua's press), then does its thing ---- */
:root { --spring-fast: linear(0, 0.02, 0.071, 0.142, 0.226, 0.316, 0.407, 0.494, 0.577, 0.653, 0.72, 0.78, 0.831, 0.875, 0.911, 0.94, 0.964, 0.983, 0.997, 1.007, 1.014, 1.019, 1.021, 1.023, 1.023, 1.022, 1.02, 1.018, 1.017, 1.014, 1.012, 1.01, 1.009, 1.007, 1.006, 1.004, 1.003, 1.002, 1.002, 1.001, 1); --spring-fast-dur: 300ms; }
:root[data-surface="flat"] .v-home .lt.focus, :root[data-surface="flat"] .v-home .lt.said-focus { --fs: 1; }
.v-home .lt-bg::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--k-ink); opacity: 0; transition: opacity 140ms var(--motion-ease); pointer-events: none; z-index: 1; }
@media (hover: hover) { .v-home .lt[data-lt]:hover .lt-bg::before { opacity: .04; } }
.v-home .lt.pressing .lt-bg::before { opacity: .1; }
button, .lt, .pf, .chip, .gchip, .mm-node { -webkit-tap-highlight-color: transparent; }
/* a tile opens into its own card */
.lt-detail .c-head { display: flex; align-items: center; gap: 10px; }
.lt-detail .c-ico { background: var(--kd); color: #fff; }
.lt-detail .lt-dx { position: static; margin-left: auto; width: 38px; height: 38px; }
.lt-detail .c-body { padding-top: 4px; }
.ld-row { padding: 14px 0; border-top: 1px solid var(--line); } .ld-row:first-child { border-top: 0; }
.ld-row .big { font: 650 clamp(24px, 2.4vw, 32px)/1.1 var(--s-font, var(--font)); letter-spacing: -.02em; } .ld-row .sub { color: var(--ink-2); font-size: 15.5px; margin-top: 4px; }
.lt-detail .lt-act { margin-top: 14px; }
.lt-detail .lt-act button { background: var(--ink); color: var(--sheet); } .lt-detail .lt-act button + button { background: var(--raised); color: var(--ink); }

/* ---- occasions: omx dresses the day itself: a small change in the room, one charm on the card it's about ---- */
.wall[data-occ="thanks"] { --far: #dcb48a; --mid: #c98b4e; --near: #8f5a30; --sky-c: #ffd9a8; --glow: #ffd08a; }
:root[data-theme="dark"] .wall[data-occ="thanks"] { --far: #3b2a22; --mid: #2c1c14; --near: #1a100b; --glow: #7a4a2a; }
.wall[data-occ="school"] { --sky-a: #6cb8ff; --sky-b: #c4e6ff; --sky-c: #fff2cc; }
.wall[data-occ="game"] { --glow: #e8ffd6; } :root[data-theme="dark"] .wall[data-occ="game"] { --glow: #3d6a4a; }
.occ { opacity: 0; transition: opacity 1.4s var(--motion-ease); }
.wall[data-occ="thanks"] .occ.thanks, .wall[data-occ="school"] .occ.school, .wall[data-occ="game"] .occ.game { opacity: 1; }
.occ .leaf { animation: leafFall 14s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes leafFall { from { transform: translate(0, -120px) rotate(0deg); } 50% { transform: translate(70px, 480px) rotate(260deg); } to { transform: translate(10px, 1120px) rotate(560deg); } }
.occ .glowl { animation: sTw 3s ease-in-out infinite alternate; }
.charm { position: absolute; pointer-events: none; z-index: 4; display: block; }
.charm svg { width: 100%; height: 100%; display: block; overflow: visible; }
.charm.bag { width: 78px; height: 113px; top: -26px; right: 20px; transform-origin: 50% 0; animation: swing 3.4s ease-in-out infinite alternate; }
.charm.tag { width: 54px; height: 100px; top: -20px; right: 26px; transform-origin: 50% 0; animation: swing 3s ease-in-out infinite alternate; }
@keyframes swing { from { rotate: -7deg; } to { rotate: 7deg; } }
.charm.pennant { width: 116px; height: 70px; top: -22px; right: 22px; rotate: -10deg; transform-origin: 0 100%; animation: flap 1.6s ease-in-out infinite alternate; }
@keyframes flap { from { rotate: -12deg; } to { rotate: -5deg; } }
.charm.hat { width: 66px; height: 80px; top: -40px; right: 18px; rotate: 16deg; }
.charm.umbrella { width: 84px; height: 84px; top: -34px; right: 16px; rotate: 10deg; }
.charm.turkey { width: 134px; height: 86px; top: -52px; right: 26px; }
.lt[data-lt="game"] .lt-face .big, .kick { font-family: "Barlow Condensed", var(--font); font-variant-numeric: tabular-nums; }
.lt[data-lt="game"] .lt-face .big { text-transform: uppercase; letter-spacing: .01em; font-weight: 700; }
.kick { font-weight: 700; font-size: 1.15em; letter-spacing: .03em; color: var(--accent); }
:root[data-surface="flat"] .v-home .lt-l .kick, :root[data-surface="flat"] .v-home .lt-xl .kick { color: #fff; }
.ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ch-card { border-radius: 16px; background: var(--k-fill, #eee); padding: 34px 12px 12px; position: relative; min-height: 140px; display: flex; flex-direction: column; justify-content: flex-end; }
.ch-card .mini { position: relative; height: 56px; border-radius: 14px; background: var(--k-surface); }
.ch-card b { font-size: 13.5px; margin-top: 10px; } .ch-card small { font-size: 12px; color: var(--k-ink2); line-height: 1.3; }
.ch-card .charm { animation: none; }

  const down = { scale: String(pressAmt(el)) }, a = el.animate([{ scale: "1" }, down], { duration: 110, easing: "ease-out", fill: "forwards" }); a.id = "press";
