# Runs the Mac builds on GitHub's Macs: each app drives itself through its steps (MOJOUI_TEST) and records a report
# (pictures, view dumps, a log); the reports and any crash logs come back as an artifact. The builds are the
# assets of the mac-ci pre-release, cross-compiled on Linux.
name: mac-test
on:
  push:
    branches: [mac-test]
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download the builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download mac-ci -R "$GITHUB_REPOSITORY" -D zips
      - name: Build omxplorer and the GPU fractal natively with the GPU (Metal), in place of the cross-built zips (omxcode#3, D-5311)
        if: matrix.os == 'macos-26'
        continue-on-error: true
        timeout-minutes: 20  # (a hung install leaves the job's time for the cross-built run)
        run: |
          mkdir -p out src
          native=""
          for a in omxplorer gpu; do if [ ! -f ci/apps.txt ] || grep -qx "$a" ci/apps.txt; then native="$native $a"; fi; done
          if [ -z "$native" ]; then echo "no natively built app in this run (ci/apps.txt)"; exit 0; fi
          trap 'echo "native build step failed at line $LINENO: the cross-built zips run" >> "$GITHUB_WORKSPACE/out/native-build.txt"' ERR
          tar -xzf zips/omxcode-src.tar.gz -C src
          curl -fsSL https://pixi.sh/install.sh | bash > out/native-setup.txt 2>&1
          export PATH="$HOME/.pixi/bin:$PATH"
          xcodebuild -downloadComponent MetalToolchain >> out/native-setup.txt 2>&1 || echo "no Metal toolchain" >> out/native-build.txt
          cd src
          pixi install --frozen >> ../out/native-setup.txt 2>&1
          for a in $native; do
            log=../out/native-build.txt; [ "$a" = omxplorer ] || log=../out/native-build-$a.txt
            # (the runner's GPU is a virtual one: MAX can't name it, so name M1's Metal family, as the GPU probe does)
            if MAC_GPU=metal:1 bash scripts/build.sh "$a" mac > "$log" 2>&1; then
              pixi run mojo --version >> "$log" 2>&1 || true  # (which compiler built it: goal 52's M6)
              zip=$(ls build/"$a"/mac/*-mac.zip | head -1)
              rm -f "../zips/$a-mac.zip" && cp "$zip" "../zips/$a-mac.zip"
              cp "$zip" "../out/$a-mac-gpu.zip"  # (the download, once its run is clean: D-309; gpu's, to run on a real Mac)
              echo "NATIVE GPU BUILD IN USE" | tee -a "$log"
            else
              echo "native build failed: the cross-built zip runs" | tee -a "$log"
            fi
            tail -30 "$log"
          done
          case " $native " in *" gpu "*)  # which pixel kernels Metal compiles, and the page-sized wrap (D-5311)
            if pixi run mojo build -I . -D MOJOUI_MAC_GPU --target-accelerator metal:1 ../ci/pixelprobe.mojo -o ../probe > ../out/pixelprobe-build.txt 2>&1; then
              for v in list 1d simd_int simd_int32 simd_uint float_int solid int_maths float_uint loop_int loop_int32 mandelbrot mandelbrot32 wrap; do
                ../probe "$v" >> ../out/pixelprobe.txt 2>&1 || echo "FAIL $v: exit $?" >> ../out/pixelprobe.txt
              done
            else echo "probe build failed" >> ../out/pixelprobe.txt; fi
            grep -E "^(OK|FAIL|DEVICE)|failed" ../out/pixelprobe.txt ;;
          esac
          if [ -d build/omxplorer/mac/OmxplorerMojo.app ]; then
            otool -L build/omxplorer/mac/OmxplorerMojo.app/Contents/MacOS/OmxplorerMojo build/omxplorer/mac/OmxplorerMojo.app/Contents/Frameworks/*.dylib >> ../out/native-build.txt 2>&1 || true
            otool -l build/omxplorer/mac/OmxplorerMojo.app/Contents/MacOS/OmxplorerMojo | grep -A2 LC_RPATH >> ../out/native-build.txt 2>&1 || true
          fi
          mv .pixi ../pixi-away  # (the apps run on what they carry, as on a Mac that never had pixi)
          echo "pixi env moved away" >> ../out/native-build.txt
      - name: Build omxconsole natively (console + consoled with Flare's shims; goal 55)
        timeout-minutes: 25
        run: |
          mkdir -p out src2
          if [ ! -f ci/apps.txt ] || ! grep -qx omxconsole ci/apps.txt; then echo "omxconsole isn't in this run (ci/apps.txt)"; exit 0; fi
          tar -xzf zips/omxcode-src.tar.gz -C src2
          curl -fsSL https://pixi.sh/install.sh | bash > out/omxconsole-setup.txt 2>&1
          export PATH="$HOME/.pixi/bin:$PATH"
          cd src2
          pixi install --frozen >> ../out/omxconsole-setup.txt 2>&1 || { echo "pixi install failed" | tee -a ../out/omxconsole-build.txt; tail -20 ../out/omxconsole-setup.txt; exit 0; }
          if bash scripts/build.sh console mac > ../out/omxconsole-build.txt 2>&1; then
            # the download as it ships (omxconsole.app, its icon, signed): the zip that runs below is the one that ships
            bash scripts/package.sh omxconsole mac >> ../out/omxconsole-build.txt 2>&1
            cp dist/omxconsole-mac-arm64.zip "$GITHUB_WORKSPACE/zips/omxconsole-mac.zip"
            cp dist/omxconsole-mac-arm64.zip "$GITHUB_WORKSPACE/out/"
            echo "OMXCONSOLE BUILT ($(pixi run mojo --version 2>/dev/null))" | tee -a ../out/omxconsole-build.txt
          else
            echo "omxconsole build failed" | tee -a ../out/omxconsole-build.txt
          fi
          otool -L build/console/mac/ConsoleMojo.app/Contents/MacOS/consoled >> ../out/omxconsole-build.txt 2>&1 || true
          ls -la build/console/mac/ConsoleMojo.app/Contents/MacOS build/console/mac/ConsoleMojo.app/Contents/Frameworks >> ../out/omxconsole-build.txt 2>&1 || true
          mv .pixi ../omxconsole-pixi-away  # (the app runs without the env, as a download does)
          tail -40 ../out/omxconsole-build.txt
      - name: Run each app through its steps
        run: bash ci/run.sh
      - name: GPU probe (a Mojo kernel through MAX on this Mac's GPU; docs/plans/speed.md)
        if: matrix.os == 'macos-26'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          mkdir -p out probe
          if [ -f ci/apps.txt ] && ! grep -qx omxplorer ci/apps.txt; then echo "omxplorer isn't in this run (ci/apps.txt)"; exit 0; fi
          curl -fsSL https://pixi.sh/install.sh | bash > out/gpuprobe-setup.txt 2>&1
          export PATH="$HOME/.pixi/bin:$PATH"
          cd probe
          pixi init --platform osx-arm64 . >> ../out/gpuprobe-setup.txt 2>&1
          pixi add "python=3.13.*" >> ../out/gpuprobe-setup.txt 2>&1
          pixi add --pypi "mojo>=1.2,<1.3" "max>=26.6.0,<27" >> ../out/gpuprobe-setup.txt 2>&1
          xcodebuild -downloadComponent MetalToolchain >> ../out/gpuprobe-setup.txt 2>&1 || true
          # (the runner's GPU is a virtual one: "Unknown GPU architecture" on its own, so name M1's Metal family too)
          pixi run mojo run ../ci/gpuprobe.mojo > ../out/gpuprobe-auto.txt 2>&1 || echo "exit $?" >> ../out/gpuprobe-auto.txt
          pixi run mojo run --target-accelerator metal:1 ../ci/gpuprobe.mojo > ../out/gpuprobe.txt 2>&1 || echo "exit $?" >> ../out/gpuprobe.txt
          ioreg -l | grep -i -m 5 '"model"\|IOGPU\|AGX\|paravirt' > ../out/gpu-hardware.txt 2>&1 || true
          cat ../out/gpuprobe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.os }}
          path: out/
