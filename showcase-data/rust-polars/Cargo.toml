[package]
name = "dash"
version = "0.1.0"
edition = "2024"

[dependencies]
polars = { version = "0.55.2", default-features = false, features = ["lazy", "parquet", "dtype-date", "dtype-categorical", "performant", "streaming", "fmt"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_extras = { version = "0.37", features = ["datepicker"] }
jiff = "0.2"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
